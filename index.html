+</style></head><body><main class="game"><header><div><h1>Star Catcher</h1><p class="tag">Catch the stars. Dodge the meteors. Beat your best.</p></div><div class="stats"><div>Score<strong id="score">0</strong></div><div>Best<strong id="best">0</strong></div></div></header><section class="board"><canvas id="game" width="800" height="600"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">Ready?</h2><p id="message">Move your ship with ← → or A / D and catch the golden stars.</p><button id="start">Start game</button></div></div></section><p class="hint">On touch screens, drag your ship. Every star is worth 10 points.</p></main>
